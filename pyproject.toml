[project]
name = "inf8239-u03-recommenders"
version = "0.1.0"
description = "Sistemas recomendadores reproducibles para INF-8239"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "joblib>=1.4,<2",
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "requests>=2.32,<3",
  "scikit-learn>=1.5,<2",
  "seaborn>=0.13,<1",
  "streamlit>=1.40,<2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "psutil>=7.2.2",
    "pymupdf>=2.0",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "reportlab>=5.0.1",
    "ruff>=0.9,<1",
    "tabulate>=0.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inf8239_u03"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra"
